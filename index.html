<!DOCTYPE html>
<html>
<head>
  <title>AfriPiPay Developer App</title>

  <script src="https://sdk.minepi.com/pi-sdk.js"></script>

<script>
Pi.init({
 version:"2.0"
});

    let currentUser = null;

    async function loginWithPi() {
      try {
        const scopes = ["payments"];

        const auth = await Pi.authenticate(
          scopes,
          function(payment) {
            console.log("Incomplete payment found:", payment);
          }
        );

        currentUser = auth.user;

        document.getElementById("status").innerText =
          "Logged in as " + currentUser.username;

      } catch (err) {
        console.error(err);
        alert("Pi login failed");
      }
    }

    async function payWithPi() {
      try {

        if (!window.Pi) {
          alert("Pi SDK not available.");
          return;
        }

        const paymentData = {
          amount: 0.0001,
          memo: "AfriPiPay test payment",
          metadata: {
            app: "AfriPiPay"
          }
        };

        const callbacks = {

          onReadyForServerApproval: async function(paymentId) {

            await fetch("/payment-callback", {
              method: "POST",
              headers: {
                "Content-Type": "application/json"
              },
              body: JSON.stringify({
                action: "approve",
                paymentId
              })
            });

          },

          onReadyForServerCompletion: async function(paymentId, txid) {

            await fetch("/payment-callback", {
              method: "POST",
              headers: {
                "Content-Type": "application/json"
              },
              body: JSON.stringify({
                action: "complete",
                paymentId,
                txid
              })
            });

          },

          onCancel: function(paymentId) {
            console.log("Cancelled:", paymentId);
          },

          onError: function(error) {
            console.error(error);
          }
        };

        await Pi.createPayment(paymentData, callbacks);

      } catch (err) {
        console.error(err);
      }
    }
  </script>
</head>

<body>

  <h1>AfriPiPay Developer App</h1>

  <p id="status">Not logged in</p>

  <button onclick="loginWithPi()">
    Login with Pi
  </button>

  <button onclick="payWithPi()">
    Pay with Pi
  </button>

</body>
</html>
